[package]
name = "deskpet-mac"
version = "1.2.0"
edition = "2021"
description = "The C interface the Mac app uses to run and draw pet modules (see deskpet.h)"
publish = false

[lib]
name = "deskpet_mac"
crate-type = ["staticlib", "rlib"]

[dependencies]
deskpet-host = { path = "../../host" }
petkit = { path = "../../sdk/petkit" }
