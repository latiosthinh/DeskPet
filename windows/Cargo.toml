[package]
name = "deskpet"
version = "1.2.0"
edition = "2021"
description = "A tiny pixel pet that lives on your taskbar"
publish = false

[[bin]]
name = "DeskPet"
path = "src/main.rs"

[dependencies]
hmac = "0.12"
sha2 = { version = "0.10", default-features = false }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"     # smallest code
lto = true
codegen-units = 1
panic = "abort"
strip = true
