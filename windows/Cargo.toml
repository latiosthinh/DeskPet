[package]
name = "deskpet"
version = "1.2.0"
edition = "2021"
description = "A tiny pixel pet that lives on your taskbar"
publish = false

[[bin]]
name = "DeskPet"
path = "src/main.rs"

[dependencies]
petkit = { path = "../sdk/petkit" }
pet-witcher = { path = "../pets/witcher" }
pet-moona = { path = "../pets/moona" }
pet-samurai = { path = "../pets/samurai" }
pet-ninja = { path = "../pets/ninja" }
pet-lunette = { path = "../pets/lunette" }
pet-sirclank = { path = "../pets/sirclank" }
pet-mossback = { path = "../pets/mossback" }
pet-hexley = { path = "../pets/hexley" }
pet-wispaling = { path = "../pets/wispaling" }
pet-grumbo = { path = "../pets/grumbo" }
pet-sprout = { path = "../pets/sprout" }
pet-puddle = { path = "../pets/puddle" }
pet-pip = { path = "../pets/pip" }
pet-ember = { path = "../pets/ember" }
pet-mochi = { path = "../pets/mochi" }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

