[package]
name = "deskpet"
version = "1.2.0"
edition = "2021"
description = "A tiny pixel pet that lives on your taskbar"
publish = false

[[bin]]
name = "DeskPet"
path = "src/main.rs"

[dependencies]
petkit = { path = "../shared/petkit" }
deskpet-host = { path = "../shared/host" }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

